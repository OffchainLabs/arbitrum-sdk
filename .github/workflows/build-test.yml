name: Build, Test

on:
  pull_request:
  workflow_dispatch:

env:
  MAINNET_RPC: ${{ secrets.MAINNET_RPC }}

jobs:
  install:
    name: Install on Node.js v${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          cache-key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-monorepo

  lint:
    name: Lint on Node.js v${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    needs: install
    permissions:
      checks: write # https://github.com/mikepenz/action-junit-report/issues/23#issuecomment-1412597753
    env:
      TEST_PATH: /tmp/test-results
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          cache-key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-monorepo

      - name: Lint sdk
        run: |
          yarn gen:abi
          yarn build
          yarn lint --format junit -o $TEST_PATH/sdk-lint.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-${{ github.run_id }}-node-v${{ matrix.node-version }}
          path: ${{ env.TEST_PATH }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always() # always run even if the previous step fails
        with:
          report_paths: '${{ env.TEST_PATH }}/sdk-lint.xml'
          fail_on_failure: false

  audit:
    name: Audit on Node.js v${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          cache-key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-monorepo

      - run: yarn audit:ci

  test-unit:
    name: Test (Unit) on Node.js v${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          cache-key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-monorepo

      - name: Build
        run: |
          yarn gen:abi
          yarn build

      - name: Run unit tests
        run: CI=true yarn test:unit

  test-integration:
    name: Test (Integration) on Node.js v${{ matrix.node-version }}${{ matrix.chain.orbit-test == '1' && ' with L3' || '' }}${{ matrix.chain.decimals && format(' with custom gas token ({0} decimals)', matrix.chain.decimals) || '' }} (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # runs all tests to completion even if one fails
      matrix:
        node-version: [24]
        chain:
          - orbit-test: '0'
          - orbit-test: '1'
          - orbit-test: '1'
            decimals: 16
          - orbit-test: '1'
            decimals: 18
          - orbit-test: '1'
            decimals: 20
        shard: [1, 2, 3, 4]

    needs: install
    env:
      ORBIT_TEST: ${{ matrix.chain.orbit-test }}
      DECIMALS: ${{ matrix.chain.decimals || '18' }}
      TESTNODE_TAG: v0.6.1-nc3.2-${{ matrix.chain.orbit-test == '0' && 'l2' || (matrix.chain.decimals && format('l3-custom-{0}', matrix.chain.decimals) || 'l3-eth') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node_modules
        uses: OffchainLabs/actions/node-modules/install@main
        with:
          cache-key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-monorepo

      # Pulls from GHCR usually take 10-30s but sometimes stall for minutes. The image
      # comes from the Actions cache instead, tagged local/ so the action skips its pull.
      - name: Restore testnode image
        id: testnode-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/testnode-image.tar.zst
          key: testnode-${{ env.TESTNODE_TAG }}

      - name: Load testnode image
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/testnode-image.tar.zst"
          if [ -f "$file" ]; then
            zstd -dc "$file" | docker load
          else
            docker pull "ghcr.io/offchainlabs/arbitrum-litro:$TESTNODE_TAG"
            docker tag "ghcr.io/offchainlabs/arbitrum-litro:$TESTNODE_TAG" "local/arbitrum-testnode:$TESTNODE_TAG"
            docker save "local/arbitrum-testnode:$TESTNODE_TAG" | zstd -T0 -3 -o "$file"
          fi

      - name: Save testnode image
        if: steps.testnode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true # another shard may save the same key first
        with:
          path: ${{ runner.temp }}/testnode-image.tar.zst
          key: testnode-${{ env.TESTNODE_TAG }}

      - name: Set up the local node
        uses: OffchainLabs/arbitrum-litro@v0.6.1
        with:
          version: v0.6.1
          image-repository: local/arbitrum-testnode
          l3-enabled: ${{ matrix.chain.orbit-test == '1' }}
          fee-token-decimals: ${{ matrix.chain.decimals }}
          network-config-path: packages/sdk/localNetwork.json

      - name: Copy .env
        run: cp ./.env-sample ./.env

      - name: Generate ABIs
        run: yarn gen:abi

      - name: Run integration tests
        working-directory: packages/sdk
        env:
          NODE_OPTIONS: --no-experimental-strip-types
          CI: true
        run: |
          files=$(scripts/integrationShard.sh ${{ matrix.shard }})
          echo "$files"
          yarn mocha $files --timeout 30000000 --bail
